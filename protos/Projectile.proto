#VRML_SIM R2025a utf8

PROTO Projectile [
  field SFVec3f translation 0 -3 0.5
  field SFString name "PROJECTILE"
  field SFString controller "projectile_controller"
  field SFBool supervisor TRUE
  field SFVec3f linearVelocity 0 0 0
] {
  Robot {
    translation IS translation
    children [
      DEF BALL_SHAPE Shape {
        appearance PBRAppearance {
          baseColor 1 0 0
          roughness 0.3
          metalness 0
        }
        geometry Sphere {
          radius 0.5
          subdivision 4
        }
      }
    ]
    name IS name
    model "ball"
    boundingObject USE BALL_SHAPE
    physics Physics {
      density -1
      mass 1
    }
    linearVelocity IS linearVelocity
  }
  controller IS controller
  supervisor IS supervisor
}

