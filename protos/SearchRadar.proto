#VRML_SIM R2025a utf8

EXTERNPROTO "RadarBar.proto"

PROTO SearchRadar [
  field SFVec3f translation 0 4 0
  field SFString name "SEARCH_RADAR"
  field SFString motorName "SEARCH_RADAR_MOTOR"
  field SFBool supervisor TRUE
] {
  Robot {
    translation IS translation
    name IS name
    model "search_radar"
    controller "search_radar_controller"
    supervisor IS supervisor

    children [
      Emitter {
        name "SR_CUE_EMITTER"
        type "radio"
        channel 1
        range -1
      }

      HingeJoint {
        jointParameters HingeJointParameters {
          axis 0 0 1
          anchor 0 0 1
        }

        device [
          RotationalMotor {
            name IS motorName
            maxVelocity 10
            maxTorque 10
          }

          PositionSensor {
            name "SEARCH_RADAR_ANGLE"
          }
        ]

        endPoint Solid {
          translation 0 0 1

          children [
            RadarBar {
              height 2
              radius 0.05
              color 1 0.5 0
            }

            DEF SR_FOV_BEAM Pose {
              translation 0 10 1.1
              # The controller updates this box from SearchRadar's software
              # range, azimuth beam width, and vertical FOV. Local +Y is
              # azimuth 0 in the SearchRadar math.
              children [
                Shape {
                  appearance PBRAppearance {
                    baseColor 1 0.65 0
                    emissiveColor 0.25 0.12 0
                    roughness 1
                    metalness 0
                    transparency 0.82
                  }

                  geometry DEF SR_FOV_BOX Box {
                    size 7 20 40
                  }
                }
              ]
            }

            Pose {
              translation 0 0 1.1
              children [
                Shape {
                  appearance PBRAppearance {
                    baseColor 0.1 0.1 1
                    roughness 0.4
                    metalness 0.2
                  }

                  geometry Box {
                    size 0.5 0.25 0.25
                  }
                }
              ]
            }
          ]

          boundingObject Box {
            size 0.7 0.7 2.4
          }
        }
      }
    ]
  }
}
