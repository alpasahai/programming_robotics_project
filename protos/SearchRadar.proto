#VRML_SIM R2025a utf8
# template language: javascript

EXTERNPROTO "RadarBar.proto"

PROTO SearchRadar [
  field SFVec3f translation 0 10 0
  field SFString name "SEARCH_RADAR"
  field SFString motorName "SEARCH_RADAR_MOTOR"
  field SFBool supervisor TRUE
  # Single knob for the radar's height: the pole length in metres. The rotating
  # endpoint, the beam/head mount, and the bounding box are all derived from it,
  # so changing this one number scales the whole radar and keeps the pole sitting
  # on the floor. Lower the radar with e.g. SearchRadar { mastHeight 1.2 }.
  field SFFloat mastHeight 2
  # Initial heading of the rotating head, in radians about +Z (the joint's
  # starting position before the controller sweeps it). Default pi/2.
  field SFFloat initialAngle -1.5708
  # FOV cone: forward offset (the controller sets x/y to place the cone centre at
  # range/2 on local +Y) and dimensions (synced to the sensor spec at runtime).
  # z stays 0 — the beam's mounting height comes from mastHeight via the mount
  # Pose below, not from here.
  field SFVec3f fovConeOffset 0 10 0
  field SFFloat fovConeHeight 20
  field SFFloat fovConeRadius 3.5
] {
  %<
    const mast = fields.mastHeight.value;
    const half = mast / 2;     // endpoint sits at half the pole length so the pole is grounded
    const topZ = half + 0.1;   // head/beam sit just above the pole top, in endpoint-local coords
  >%
  Robot {
    translation IS translation
    name IS name
    model "search_radar"
    controller "search_radar_controller"
    supervisor IS supervisor

    children [
      Emitter {
        name "SR_CUE_EMITTER"
        type "radio"
        channel 1
        range -1
      }

      HingeJoint {
        jointParameters HingeJointParameters {
          axis 0 0 1
          anchor 0 0 %<= half >%
          position IS initialAngle
        }

        device [
          RotationalMotor {
            name IS motorName
            maxVelocity 10
            maxTorque 10
          }

          PositionSensor {
            name "SEARCH_RADAR_ANGLE"
          }
        ]

        endPoint Solid {
          translation 0 0 %<= half >%

          children [
            RadarBar {
              height %<= mast >%
              radius 0.05
              color 1 0.5 0
            }

            # Beam/head mount — its height is derived from mastHeight; the cone
            # itself is offset and sized by the controller below.
            Pose {
              translation 0 0 %<= topZ >%
              children [
                DEF SR_FOV_BEAM Pose {
                  translation IS fovConeOffset
                  # Local +Y is azimuth 0 in the SearchRadar math. The child Pose
                  # rotates the Webots Cone local +Z back toward local -Y so the
                  # cone apex sits at the radar phase centre.
                  children [
                    Pose {
                      rotation 1 0 0 1.5708
                      children [
                        Shape {
                          appearance PBRAppearance {
                            baseColor 1 0.65 0
                            emissiveColor 0.25 0.12 0
                            roughness 1
                            metalness 0
                            transparency 0.82
                          }

                          geometry DEF SR_FOV_CONE Cone {
                            bottomRadius IS fovConeRadius
                            height IS fovConeHeight
                            subdivision 32
                            side TRUE
                            bottom TRUE
                          }
                        }
                      ]
                    }
                  ]
                }
              ]
            }

            # Radar head, mounted at the same height as the beam.
            Pose {
              translation 0 0 %<= topZ >%
              children [
                Shape {
                  appearance PBRAppearance {
                    baseColor 0.1 0.1 1
                    roughness 0.4
                    metalness 0.2
                  }

                  geometry Box {
                    size 0.5 0.25 0.25
                  }
                }
              ]
            }
          ]

          boundingObject Box {
            size 0.7 0.7 %<= mast + 0.4 >%
          }
        }
      }
    ]
  }
}
