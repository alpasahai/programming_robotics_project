#VRML_SIM R2025a utf8

PROTO SimulatedProjectile [
  field SFVec3f translation 0 -3 0.5
  field SFString name "PROJECTILE"
  field SFVec3f linearVelocity 0 0 0
] {
  Solid {
    translation IS translation
    children [
      DEF BALL_SHAPE Shape {
        appearance PBRAppearance {
          baseColor 1 0 0
          roughness 0.3
          metalness 0
        }
        geometry Sphere {
          radius 0.15
          subdivision 4
        }
      }
    ]
    name IS name
    model "ball"
    boundingObject USE BALL_SHAPE
    physics Physics {
      density -1
      mass 1
    }
    linearVelocity IS linearVelocity
  }
}
