#VRML_SIM R2025a utf8

EXTERNPROTO "AtlasLaser.proto"

PROTO AtlasTurret [
  field SFVec3f translation 0 0 0.05
  field SFString name "TURRET_BASE"
  field SFString controller "atlas_controller"
  field SFBool supervisor TRUE
] {
  Robot {
    translation IS translation
    children [
      HingeJoint {
        jointParameters HingeJointParameters {
          position 0
          axis 0 0 1
        }
        device [
          RotationalMotor {
            name "PAN_MOTOR"
          }
        ]
        endPoint Solid {
          translation 0 0 0.1
          children [
            HingeJoint {
              jointParameters HingeJointParameters {
                axis 0 1 0
                anchor 0 0 0.1   # pivot at the tilt box centre, not the pan origin
              }
              device [
                RotationalMotor {
                  name "TILT_MOTOR"
                  # 180-degree tilt arc: straight down (-pi/2) through
                  # horizontal (0) to straight up (+pi/2).
                  minPosition -1.5708
                  maxPosition 1.5708
                }
              ]
              endPoint Solid {
                translation 0 0 0.1   # tilt box rests on top of the pan box
                children [
                  Shape {
                    appearance PBRAppearance {
                      baseColor 0.25 0.15 0.25
                    }
                    geometry Box {
                      size 0.1 0.1 0.1
                    }
                  }
                  AtlasLaser {
                    translation 0 0 4
                    rotation 0 0 1 0
                  }
                ]
                name "TILT_PLATFORM"
                boundingObject Box {
                  size 0.1 0.1 0.1
                }
                physics Physics {
                  density -1   # -1 = ignore density, use explicit mass below
                  mass 1      # kg
                }
              }
            }
            Shape {
              appearance PBRAppearance {
                baseColor 1 0 1
              }
              geometry Box {
                size 0.2 0.2 0.1
              }
            }
          ]
          name "PAN_PLATFORM"
          boundingObject Box {
            size 0.2 0.2 0.1
          }
          physics Physics {
            density -1   # -1 = ignore density, use explicit mass below
            mass 5      # kg
          }
        }
      }
      Shape {
        appearance PBRAppearance {
          baseColor 1 1 1
        }
        geometry Box {
          size 0.3 0.3 0.1
        }
      }
    ]
    name IS name
    model "box"
    boundingObject Box {
      size 0.3 0.3 0.1
    }
    controller IS controller
    supervisor IS supervisor
  }
}
